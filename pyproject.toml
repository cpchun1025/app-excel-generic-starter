[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-automation-framework"
version = "0.1.0"
description = "Configuration-driven Excel automation framework"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "openpyxl>=3.1.5,<3.2",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
excel-automation = "excel_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
